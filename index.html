<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawn Shop - Client</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background-color: #f8fafc; color: #334155; }
        .container { max-width: 600px; margin: auto; }
        h2 { color: #0f172a; font-weight: 600; letter-spacing: -0.5px; }
        .box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        input, select, button { font-family: 'Poppins', sans-serif; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; outline: none; transition: border 0.3s; }
        input:focus, select:focus { border-color: #3b82f6; }
        button { background-color: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 500; width: auto; transition: background 0.3s; }
        button:hover { background-color: #2563eb; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f1f5f9; }
        .item:last-child { border-bottom: none; padding-bottom: 0; }
        .badge { background: #ef4444; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Inventory & Exchange</h2>

    <div class="box">
        <h4 style="margin-top: 0; color: #64748b; font-size: 12px; letter-spacing: 1px;">CURRENCY CONVERTER</h4>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <div>
                <label style="font-size: 12px; color: #64748b; font-weight: 500;">AMOUNT</label><br>
                <input type="number" id="suma" placeholder="100" style="width: 130px;">
            </div>
            <div>
                <label style="font-size: 12px; color: #64748b; font-weight: 500;">FROM</label><br>
                <select id="valuta">
                    <option value="EUR">EUR (Euro)</option>
                    <option value="USD">USD (Dollar)</option>
                    <option value="GBP">GBP (Liră Sterlină)</option>
                    <option value="CHF">CHF (Franc Elvețian)</option>
                    <option value="RSD">RSD (Dinar Sârbesc)</option>
                    <option value="MDL">MDL (Leu Moldovenesc)</option>
                    <option value="CAD">CAD (Dollar Canadian)</option>
                    <option value="AUD">AUD (Dollar Australian)</option>
                    <option value="JPY">JPY (Yen Japonez)</option>
                </select>
            </div>
            <div style="margin-top: 15px;">
                <button onclick="calculeazaSchimb()">Calculate</button>
            </div>
        </div>
        <h3 id="rezultat-schimb" style="margin-top: 10px; color: #0f172a; font-weight: 600;"></h3>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: #0f172a; font-weight: 600;">Available Items</h3>
        <button onclick="incarcaObiecte()" style="background-color: #64748b; padding: 8px 15px; font-size: 13px;">Refresh</button>
    </div>
    <div id="lista-obiecte" class="box"></div>
</div>

<script>
    const API_BASE = "https://lavonna-unskinned-unspontaneously.ngrok-free.dev";
    const reqHeaders = { "ngrok-skip-browser-warning": "true" };

    function calculeazaSchimb() {
        let suma = document.getElementById("suma").value;
        let valuta = document.getElementById("valuta").value;
        if(!suma) return;

        fetch(`${API_BASE}/schimb_valutar?suma=${suma}&valuta=${valuta}`, { headers: reqHeaders })
            .then(res => res.json())
            .then(data => {
                if(data.eroare) document.getElementById("rezultat-schimb").innerText = data.eroare;
                else document.getElementById("rezultat-schimb").innerText = `${data.total_ron} RON`;
            })
            .catch(err => document.getElementById("rezultat-schimb").innerText = "Connection error");
    }

    function incarcaObiecte() {
        fetch(`${API_BASE}/obiecte`, { headers: reqHeaders })
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach(obj => {
                    // This forces the status to lowercase so it always matches perfectly!
                    let status_curent = obj.status.toLowerCase();

                    if(status_curent !== 'vandut') {
                        let btnOrBadge = status_curent === 'disponibil'
    ? `<button onclick="rezervaObiect(${obj.id}, this)" style="margin:0; padding: 8px 16px; background-color: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Reserve</button>`
    : `<button disabled style="margin:0; padding: 8px 16px; background-color: #ef4444; color: white; border: none; border-radius: 4px; cursor: not-allowed; font-weight: bold;">Reserved</button>`;
                        html += `
                        <div class="item" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0;">
                            <div><strong style="color: #0f172a; font-size: 16px;">${obj.nume}</strong> <br> <span style="color: #64748b; font-size: 14px;">${obj.pret} RON</span></div>
                            <div>${btnOrBadge}</div>
                        </div>`;
                    }
                });
                document.getElementById("lista-obiecte").innerHTML = html || "<p style='color: #64748b;'>No items available.</p>";
            });
    }

    function rezervaObiect(id, btnElement) {
        // 1. INSTANTLY turn this specific button red and lock it
        btnElement.innerText = "Reserved";
        btnElement.style.backgroundColor = "#ef4444"; // Changes to Red
        btnElement.disabled = true;
        btnElement.style.cursor = "not-allowed";

        // 2. Silently tell the Python database in the background
        fetch(`${API_BASE}/rezervare/${id}?user_id=1`, { method: 'POST', headers: reqHeaders })
        .then(res => res.json())
        .then(data => {
            if (data.eroare) {
                alert("Database Error: " + data.eroare);
            }
        })
        .catch(err => console.log("Connection Failed!"));
    }
</script>


</body>
</html>
